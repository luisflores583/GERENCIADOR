services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voley
      POSTGRES_PASSWORD: voley_dev
      POSTGRES_DB: voley
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voley -d voley"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://voley:voley_dev@db:5432/voley
      SESSION_SECRET: altere-esta-chave-local-antes-de-publicar
      COOKIE_SECURE: "false"
      SEED_ON_START: "true"
      SEED_ADMIN_EMAIL: admin@arena.local
      SEED_ADMIN_PASSWORD: arena-local-demo
      SEED_ATHLETE_PASSWORD: atleta-local-demo
      EXIBIR_ACESSO_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
